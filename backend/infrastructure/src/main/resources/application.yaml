spring:
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:mydb}
    username: ${DATABASE_USER:myuser}
    password: ${DATABASE_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

# app.admin.* values below are local-dev defaults only.
# They MUST be overridden via the ADMIN_USERNAME / ADMIN_PASSWORD environment variables
# in any real deployment.
app:
  admin:
    username: ${ADMIN_USERNAME:test}
    password: ${ADMIN_PASSWORD:password}

springdoc:
  swagger-ui:
    enabled: true

  api-docs:
    enabled: true
