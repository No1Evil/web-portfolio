<div class="page-container">

  <header class="section-header">
    <h1 class="title">{{ langService.translate('contacts.title') }}</h1>
    <p class="subtitle">{{ langService.translate('contacts.subtitle') }}</p>
  </header>

  <div class="contact-grid">
    @for (contact of contactService.contacts(); track $index){

      <a href="{{contact.link}}" target="_blank" class="base-card contact-card {{contact.title.toLocaleLowerCase()}}">
        <div class="card-icon">
          <fa-icon [icon]="this.getIcon(contact.icon)"></fa-icon>
        </div>
        <h3>{{contact.title}}</h3>
        <p class="contact-desc">{{contact.subtitle}}</p>
        <span class="card-link">{{contact.action}} &rightarrow;</span>
      </a>
    }
  </div>

  <div class="contact-footer">
    <p>Based in Estonia 🇪🇪</p>
  </div>
</div>
