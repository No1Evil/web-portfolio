<div class="experience">
  <section class="card">
    <div class="card__head">
      <h2 class="card__title">
        {{ editingId() ? dict()['admin']['edit'] : dict()['admin']['experience']['addEntry'] }}
      </h2>
    </div>
    <form class="experience__form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field__label">{{ dict()['admin']['experience']['role'] }}</span>
        <input
          class="field__input"
          type="text"
          [ngModel]="role()"
          name="role"
          [placeholder]="dict()['admin']['experience']['placeholderRole']"
          (ngModelChange)="role.set($event)"
        />
      </label>
      <label class="field">
        <span class="field__label">{{ dict()['admin']['experience']['company'] }}</span>
        <input
          class="field__input"
          type="text"
          [ngModel]="company()"
          name="company"
          [placeholder]="dict()['admin']['experience']['placeholderCompany']"
          (ngModelChange)="company.set($event)"
        />
      </label>
      <label class="field">
        <span class="field__label">{{ dict()['admin']['experience']['location'] }}</span>
        <input class="field__input" type="text" [ngModel]="location()" name="location" (ngModelChange)="location.set($event)" />
      </label>
      <div class="experience__dates">
        <label class="field">
          <span class="field__label">{{ dict()['admin']['experience']['period'] }}</span>
          <input class="field__input" type="date" [ngModel]="startDate()" name="startDate" (ngModelChange)="startDate.set($event)" />
        </label>
        <label class="field">
          <span class="field__label">&nbsp;</span>
          <input class="field__input" type="date" [ngModel]="endDate()" name="endDate" [disabled]="present()" (ngModelChange)="endDate.set($event)" />
        </label>
      </div>
      <label class="experience__present">
        <input type="checkbox" [ngModel]="present()" name="present" (ngModelChange)="present.set($event)" />
        <span>{{ dict()['admin']['present'] }}</span>
      </label>
      <label class="field">
        <span class="field__label">{{ dict()['admin']['experience']['description'] }}</span>
        <textarea
          class="field__textarea"
          [ngModel]="description()"
          name="description"
          [placeholder]="dict()['admin']['experience']['placeholderDescription']"
          (ngModelChange)="onDescriptionChange($event)"
        ></textarea>
      </label>
      <div class="experience__form-actions">
        <button type="submit" class="experience__submit">{{ dict()['admin']['save'] }}</button>
        @if (editingId()) {
          <button type="button" class="experience__cancel" (click)="cancel()">{{ dict()['admin']['cancel'] }}</button>
        }
      </div>
    </form>
  </section>

  <section class="card">
    <div class="card__head">
      <h2 class="card__title">{{ dict()['admin']['nav']['experience'] }}</h2>
      <button type="button" class="experience__add" (click)="startAdd()">+</button>
    </div>
    <app-admin-entry-list [rows]="rows()" (edit)="editFromRow($event)" (delete)="remove($event)" />
  </section>
</div>
