services:
  database:
    image: postgres:18.6-alpine
    container_name: web-portfolio-database
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      dockerfile: ./backend/Dockerfile
    container_name: web-portfolio-backend
    restart: always
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/v3/api-docs || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    # Build requires frontend/openapi.yaml in the context (generated from the backend):
    #   (cd backend && ./gradlew :infrastructure:generateOpenApiDocs) \
    #     && cp backend/infrastructure/build/openapi.yaml frontend/openapi.yaml
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-portfolio-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  pg-data: