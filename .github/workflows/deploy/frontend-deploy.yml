name: frontend-deploy.yml

on:
  workflow_run:
    workflows: [ 'Frontend CI' ]
    types: [ 'completed' ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - name: Log in to Github Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: 'true'
          tags: ghcr.io/${{ github.repository_owner }}/portfolio-frontend:latest

      - name: Run ansible playbook to update Frontend
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          WEB_HOST: ${{ secrets.PRODUCTION_HOST }}
          WEB_USER: ${{ secrets.PRODUCTION_USER }}
        run:
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          ansible_playbook -i infrastructure/ansible/inventory/hosts.yaml \
                            infrastructure/ansible/site.yml \
                            --private-key=private_key.pem \
                            --tags "frontend"

          rm -rf private_key.pem