name: Sync main from dev

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify dev branch
        if: github.ref_name != 'dev'
        run: |
          echo "Error: could be ran only on 'dev' branch."
          exit 1

  sync:
    needs: check-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          token: '${{ secrets.SYNC_TOKEN }}'
          fetch-depth: 0

      - name: Force mirror dev to main branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"        
          git branch -f main origin/dev
          git push origin main --force