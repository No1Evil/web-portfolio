name: Backend CI
on:
  push:
    paths: [ "backend/**" ]
    branches: [ "**" ]

jobs:
  run-tests:
    runs-on: ubuntu-22.04
    name: "Backend Test"
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4.3.1

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run gradle tests
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew test