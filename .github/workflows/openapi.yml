name: OpenAPI spec

on:
  workflow_call:

permissions:
  contents: read

jobs:
  generate:
    name: Generate OpenAPI spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: mydb
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d mydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend

      - name: Generate spec
        working-directory: backend
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_NAME: mydb
          DATABASE_USER: myuser
          DATABASE_PASSWORD: mypassword
        run: |
          chmod +x gradlew
          ./gradlew :infrastructure:generateOpenApiDocs --console=plain
          cp infrastructure/build/openapi.yaml "${GITHUB_WORKSPACE}/openapi.yaml"

      - name: Upload spec
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: openapi.yaml
          if-no-files-found: error
          retention-days: 1
