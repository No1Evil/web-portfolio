name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/coverage-badge.yml'
              - '.github/workflows/openapi.yml'
              - '.github/actions/setup-backend/**'

  test:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/**/build/test-results/**/*.xml
            backend/**/build/reports/tests/**/*
          if-no-files-found: ignore

  gate:
    name: Backend CI
    needs:
      - changes
      - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        run: |
          echo "changes=${{ needs.changes.result }} test=${{ needs.test.result }}"
          failed=0
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.test.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::a required job ended with result: $result"
              failed=1
            fi
          done
          exit $failed
