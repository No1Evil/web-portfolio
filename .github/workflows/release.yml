name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Validate tag and compute version
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not a v<major>.<minor>.<patch> tag; refusing to publish."
            exit 1
          fi
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  openapi:
    name: OpenAPI spec
    needs: prepare
    uses: ./.github/workflows/openapi.yml

  backend-image:
    name: Backend image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: backend
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/portfolio-backend
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :infrastructure:bootBuildImage \
            -PimageName="${IMAGE}:${{ needs.prepare.outputs.version }}" \
            -PpublishImage=true --console=plain
          docker tag "${IMAGE}:${{ needs.prepare.outputs.version }}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

  frontend-image:
    name: Frontend image
    needs:
      - prepare
      - openapi
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: frontend

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/portfolio-frontend:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/portfolio-frontend:latest
