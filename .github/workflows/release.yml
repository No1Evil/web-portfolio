name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Validate tag and compute version
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$tag' is not v<major>.<minor>.<patch>[-alpha|-beta|-rc]; refusing to publish."
            exit 1
          fi
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  determine-release-type:
    name: Determine release type
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_suffix: ${{ steps.rel_type.outputs.tag_suffix }}
      is_prerelease: ${{ steps.rel_type.outputs.is_prerelease }}
    steps:
      - name: Determine release type
        id: rel_type
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *"-alpha"* ]]; then
            echo "tag_suffix=latest-alpha" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-beta"* ]]; then
            echo "tag_suffix=latest-beta" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-rc"* ]]; then
            echo "tag_suffix=latest-rc" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_suffix=latest" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  openapi:
    name: OpenAPI spec
    needs: prepare
    uses: ./.github/workflows/openapi.yml

  backend-image:
    name: Backend image
    needs:
      - prepare
      - determine-release-type
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: backend
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/portfolio-backend
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :infrastructure:bootBuildImage \
            -PimageName="${IMAGE}:${{ needs.prepare.outputs.version }}" \
            -PpublishImage=true --console=plain
          docker tag "${IMAGE}:${{ needs.prepare.outputs.version }}" "${IMAGE}:${{ needs.determine-release-type.outputs.tag_suffix }}"
          docker push "${IMAGE}:${{ needs.determine-release-type.outputs.tag_suffix }}"

  frontend-image:
    name: Frontend image
    needs:
      - prepare
      - openapi
      - determine-release-type
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: frontend

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/portfolio-frontend:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/portfolio-frontend:${{ needs.determine-release-type.outputs.tag_suffix }}

  create-release:
    name: GitHub release
    needs:
      - prepare
      - determine-release-type
      - backend-image
      - frontend-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ needs.determine-release-type.outputs.is_prerelease }}
          generate_release_notes: true
