name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/openapi.yml'

  openapi:
    name: OpenAPI spec
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/openapi.yml

  frontend:
    name: Frontend checks
    needs:
      - changes
      - openapi
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: frontend

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate API client
        run: npm run generate:api

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          if find src -type f \( -name '*.spec.ts' -o -name '*.test.ts' \) | grep -q .; then
            npm test
          else
            echo "::notice title=Frontend tests::No spec files found; skipping 'ng test'."
          fi

      - name: Build
        run: npm run build -- --configuration=production

  gate:
    name: Frontend CI
    needs:
      - changes
      - openapi
      - frontend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        run: |
          echo "changes=${{ needs.changes.result }} openapi=${{ needs.openapi.result }} frontend=${{ needs.frontend.result }}"
          failed=0
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.openapi.result }}" \
            "${{ needs.frontend.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::a required job ended with result: $result"
              failed=1
            fi
          done
          exit $failed
