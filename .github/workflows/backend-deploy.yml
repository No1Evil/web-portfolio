name: backend-deploy.yml
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ 'Backend CI' ]
    types: [ 'completed' ]

jobs:
  backend-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and push image
        working-directory: backend
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :infrastructure:bootBuildImage \
            -PimageName=ghcr.io/${{ github.repository_owner }}/portfolio-backend:${{ env.IMAGE_TAG }} \
            -PpublishImage=true --console=plain

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push latest
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/portfolio-backend:${{ env.IMAGE_TAG }} \
            ghcr.io/${{ github.repository_owner }}/portfolio-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/portfolio-backend:latest

