name: Backend CD

on:
  push:
    branches:
      - cicd/backend # for removal
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Lowercase registry owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and push image
        working-directory: backend
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/portfolio-backend
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :infrastructure:bootBuildImage \
            -PimageName=${{ env.IMAGE }}:${{ env.IMAGE_TAG }} \
            -PpublishImage=true --console=plain

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push latest
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/portfolio-backend
        run: |
          docker tag ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:latest

