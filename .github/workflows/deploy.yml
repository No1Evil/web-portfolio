name: Reusable Deploy
on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            PROJECT_DIR="$HOME/web-portfolio"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found. Cloning..."
              git clone git@github.com:${{ github.repository }}.git $PROJECT_DIR
            fi
            
            cd $PROJECT_DIR
            
            echo "Updating code to branch ${{ inputs.branch_name }}..."
            git fetch origin
            git checkout ${{ inputs.branch_name }}
            git pull origin ${{ inputs.branch_name }}
            
            if [ "${{ inputs.branch_name }}" == "main" ]; then
              SERVICE="portfolio-prod"
            else
              SERVICE="portfolio-test"
            fi
            
            echo "Deploying $SERVICE..."
            docker compose up -d --build $SERVICE
            
            docker image prune -f