name: Reusable Test
on:
  workflow_call:
    inputs:
      project_type:
        required: true
        type: string

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Angular
        if: ${{ inputs.project_type == 'angular' }}
        run: |
          npm install
          npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Test Java
        if: ${{ inputs.project_type == 'java' }}
        run: |
          # Тут будет mvn test или gradle test
          echo "Running Java tests..."